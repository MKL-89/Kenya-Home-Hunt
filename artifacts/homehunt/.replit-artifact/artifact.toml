kind = "web"
previewPath = "/"
title = "HomeHunt"
version = "1.0.0"
id = "artifacts/homehunt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25773

[services.development]
run = "pnpm --filter @workspace/homehunt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homehunt", "run", "build" ]
publicDir = "artifacts/homehunt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25773"
BASE_PATH = "/"
